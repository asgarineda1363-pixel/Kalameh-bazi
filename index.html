<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>کلمه‌بازی – فارسی پنجم</title>
<meta name="theme-color" content="#8FD0FF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --ink:#1E1E2E;
  --paper:#FFF6DC;
  --sun:#FFC83D;
  --sky:#8FD0FF;
  --sky2:#D9F0FF;
  --grass:#5DB347;
  --grass-d:#3F8F2F;
  --dirt:#8B5A2B;
  --dirt-d:#6B4220;
  --stone:#C3C9CF;
  --stone-d:#8A9097;
  --meaning:#3B5BDB;
  --antonym:#C2255C;
  --family:#16876A;
  --good:#2B9348;
  --bad:#D62828;
  --hi:rgba(255,255,255,.7);
  --lo:rgba(0,0,0,.2);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;overscroll-behavior-y:contain}
html{-webkit-text-size-adjust:100%}
body{
  background:linear-gradient(var(--sky),var(--sky2) 70%) fixed;
  color:var(--ink);
  font-family:"Vazirmatn","Noto Naskh Arabic",Tahoma,"Segoe UI",sans-serif;line-height:1.6;min-height:100vh;
}
/* آسمان و ابرِ مکعبی */
body::before{
  content:"";position:fixed;z-index:0;top:84px;left:22px;width:12px;height:12px;background:#fff;opacity:.92;
  box-shadow:
    12px 0 #fff,24px 0 #fff,36px 0 #fff,48px 0 #fff,
    12px -12px #fff,24px -12px #fff,36px -12px #fff,
    210px 70px #fff,222px 70px #fff,234px 70px #fff,246px 70px #fff,
    222px 58px #fff,234px 58px #fff;
}
/* زمین: چمن و خاک */
body::after{
  content:"";position:fixed;left:0;right:0;bottom:0;height:64px;z-index:0;
  background:
    linear-gradient(var(--grass) 0 14px, var(--grass-d) 14px 20px, transparent 20px),
    conic-gradient(var(--dirt-d) 25%, var(--dirt) 0 50%, var(--dirt-d) 0 75%, var(--dirt) 0) 0 20px/16px 16px;
  border-top:4px solid var(--ink);
}
#app{
  position:relative;z-index:1;max-width:440px;margin:0 auto;min-height:100vh;
  padding:16px 16px 90px;display:flex;flex-direction:column;
}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,.flip:focus-visible{outline:4px solid #fff;outline-offset:2px;box-shadow:0 0 0 6px var(--ink)}
.hidden{display:none !important}
.px{image-rendering:pixelated;display:block}

/* دکمه‌های بلوکی */
.primary,.secondary{
  border:4px solid var(--ink);border-radius:0;font-weight:900;font-size:1.15rem;padding:11px 16px;width:100%;
  transition:transform .08s, box-shadow .08s;
}
.primary{background:var(--sun);box-shadow:inset 0 4px 0 #FFE88A, inset 0 -6px 0 #D99A00, 0 5px 0 var(--ink)}
.secondary{background:var(--stone);box-shadow:inset 0 4px 0 #EEF1F3, inset 0 -6px 0 var(--stone-d), 0 5px 0 var(--ink)}
.primary:active:not(:disabled){transform:translateY(4px);box-shadow:inset 0 4px 0 #FFE88A, inset 0 -2px 0 #D99A00, 0 1px 0 var(--ink)}
.secondary:active:not(:disabled){transform:translateY(4px);box-shadow:inset 0 4px 0 #EEF1F3, inset 0 -2px 0 var(--stone-d), 0 1px 0 var(--ink)}
.primary:disabled{opacity:.5;cursor:default}
.primary.small{font-size:1rem;padding:8px 14px;margin-top:8px}
.ghost{background:rgba(255,255,255,.75);border:3px solid var(--ink);font-weight:800;font-size:.95rem;padding:2px 12px}
.stack{display:grid;gap:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* نوار بالا */
.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.top .ttl{margin:0;font-size:1.3rem;font-weight:900;flex:1;background:var(--paper);border:4px solid var(--ink);padding:0 12px;box-shadow:inset 3px 3px 0 var(--hi), inset -3px -3px 0 var(--lo)}
.prog{
  flex:1;height:20px;background:#fff;border:4px solid var(--ink);border-radius:0;overflow:hidden;
  box-shadow:inset 0 3px 0 rgba(0,0,0,.15);
}
.prog span{
  display:block;height:100%;transition:width .3s;
  background:repeating-linear-gradient(90deg,var(--grass) 0 10px,var(--grass-d) 10px 12px);
}
.pill{
  position:relative;display:flex;align-items:center;gap:6px;background:var(--paper);
  border:4px solid var(--ink);border-radius:0;padding:0 10px 0 6px;font-weight:900;
  box-shadow:inset 3px 3px 0 var(--hi), inset -3px -3px 0 var(--lo);
}
.top .pill{font-size:.95rem;padding:0 8px 0 5px}
.pill.bump{animation:bump .4s}
.delta{position:absolute;top:-10px;left:50%;transform:translateX(-50%);font-weight:900;opacity:0;pointer-events:none;text-shadow:-1px -1px 0 #fff,1px -1px 0 #fff,-1px 1px 0 #fff,1px 1px 0 #fff}
.delta.up{color:var(--good)}
.delta.down{color:var(--bad)}
.delta.show{animation:rise 1.1s ease-out}
@keyframes rise{0%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-34px)}}
@keyframes bump{0%,100%{transform:scale(1)}40%{transform:scale(1.18)}}
.fx{position:fixed;z-index:60;pointer-events:none;animation:fly .85s ease-out forwards}
@keyframes fly{from{transform:translate(0,0) scale(.6);opacity:1}to{transform:translate(var(--dx),var(--dy)) scale(1) rotate(300deg);opacity:0}}

/* صفحه اصلی */
.home{flex:1;display:flex;flex-direction:column;justify-content:center;gap:12px;text-align:center}
.homehud{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.rank{font-weight:900;background:var(--sun);border:4px solid var(--ink);padding:0 14px;box-shadow:inset 3px 3px 0 #FFE88A, inset -3px -3px 0 #D99A00}
.hero{display:flex;align-items:center;justify-content:center;gap:14px;background:var(--paper);border:4px solid var(--ink);padding:12px;box-shadow:inset 4px 4px 0 var(--hi), inset -4px -4px 0 var(--lo), 6px 6px 0 var(--ink)}
.herobox .mascot{width:84px;height:84px}
.hero h1{font-size:2.3rem;font-weight:900;margin:0;line-height:1.15;color:#fff;text-shadow:3px 3px 0 var(--ink),-1px -1px 0 var(--ink),1px -1px 0 var(--ink),-1px 1px 0 var(--ink)}
.hero .sub{margin:2px 0 0;font-size:.98rem;font-weight:700}
.count{margin:0;font-size:.9rem;font-weight:700;background:rgba(255,255,255,.8);border:3px solid var(--ink);padding:0 10px}
.prize{background:var(--paper);border:4px solid var(--ink);padding:10px 14px;text-align:right;box-shadow:inset 4px 4px 0 var(--hi), inset -4px -4px 0 var(--lo)}
.prize .ph{font-weight:700}
.pbar{height:18px;background:#fff;border:4px solid var(--ink);overflow:hidden;margin:6px 0 2px}
.pbar span{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--sun) 0 10px,#D99A00 10px 12px)}
.prize .pn{font-size:.9rem}

/* کارت سؤال */
.qcard{
  background:var(--paper);border:4px solid var(--ink);border-radius:0;
  box-shadow:inset 4px 4px 0 var(--hi), inset -4px -4px 0 var(--lo), 6px 6px 0 var(--ink);
  overflow:hidden;margin:4px 6px 18px 4px;text-align:center;
}
.qcard.shake{animation:shake .45s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.qcard .tag{background:var(--c);color:#fff;font-weight:900;padding:3px 0;border-bottom:4px solid var(--ink);box-shadow:inset 0 4px 0 rgba(255,255,255,.25)}
.qcard .word,.face .word{font-size:2.8rem;font-weight:900;line-height:1.35;padding:12px 12px 0}
.word.sm{font-size:2.1rem}
.word.xs{font-size:1.5rem}
.qcard .ask{margin:0;padding:4px 14px 8px;font-size:1.08rem;font-weight:700}
.qcard .sub{margin:0;padding:0 14px 12px;font-weight:800;color:var(--c)}
.qcard .ask:last-child{padding-bottom:16px}

/* شعر و حفظ شعر */
.verse{padding:14px 12px 4px;font-size:1.3rem;font-weight:800;line-height:2.1}
.verse .hem{display:block}
.verse.prose{font-size:1.08rem;line-height:1.9;padding:14px 16px 4px}
.slot{
  display:inline-block;vertical-align:baseline;min-width:3.2em;height:1.9em;border:none;
  border-bottom:4px dashed var(--ink);background:#FFE9A8;border-radius:0;
  font:inherit;font-weight:900;padding:0 6px;line-height:1.8;margin:0 3px;cursor:pointer;color:var(--ink);
}
.slot.active{background:var(--sun);border-bottom-style:solid}
.slot.right{background:var(--good);color:#fff;border-bottom-style:solid}
.slot.wrong{background:var(--bad);color:#fff;border-bottom-style:solid}
.bank{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:2px 0 6px}
.chip{
  --r:0deg;border:4px solid var(--ink);background:var(--stone);border-radius:0;padding:4px 16px;
  font-weight:900;font-size:1.15rem;
  box-shadow:inset 0 4px 0 #EEF1F3, inset 0 -5px 0 var(--stone-d), 0 4px 0 var(--ink);
  animation:deal .45s cubic-bezier(.2,.9,.3,1.2) both;animation-delay:calc(var(--i) * 70ms);
}
.chip:active:not(:disabled){transform:translateY(3px);box-shadow:inset 0 4px 0 #EEF1F3, 0 1px 0 var(--ink)}
.chip.used,.chip:disabled{opacity:.3;box-shadow:none;cursor:default}
.ans{min-height:1.6em;text-align:center;font-weight:900;color:var(--bad);margin:2px 0;text-shadow:0 0 3px #fff,0 0 3px #fff}

/* کارت‌های گزینه */
.cards{display:grid;gap:12px;margin-bottom:4px}
.card{
  position:relative;display:flex;align-items:center;gap:12px;width:100%;text-align:right;
  background:var(--paper);border:4px solid var(--ink);border-radius:0;
  box-shadow:inset 4px 4px 0 var(--hi), inset -4px -4px 0 var(--lo), 0 5px 0 var(--ink);
  padding:11px 14px;font-size:1.12rem;font-weight:800;
  transform:rotate(var(--r));animation:deal .45s cubic-bezier(.2,.9,.3,1.2) both;animation-delay:calc(var(--i) * 90ms);
  transition:background .15s;
}
@keyframes deal{from{opacity:0;transform:translateY(40px) rotate(calc(var(--r) * 3))}to{opacity:1;transform:rotate(var(--r))}}
.card:active:not(:disabled){transform:translateY(4px) rotate(var(--r));box-shadow:inset 4px 4px 0 var(--hi), inset -4px -4px 0 var(--lo), 0 1px 0 var(--ink)}
.card .badge{
  flex:none;width:42px;height:42px;background:var(--sun);border:4px solid var(--ink);
  display:flex;align-items:center;justify-content:center;font-size:.9rem;font-weight:900;
  box-shadow:inset 3px 3px 0 #FFE88A, inset -3px -3px 0 #D99A00;
}
.card .box{
  flex:none;width:34px;height:34px;border:4px solid var(--ink);background:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:900;font-size:1.3rem;
}
.card.on .box{background:var(--sun)}
.card .txt{flex:1;line-height:1.5}
.card .mark{flex:none;font-weight:900;font-size:1.4rem;min-width:24px;text-align:center}
.card.right{background:var(--good);color:#fff}
.card.wrong{background:var(--bad);color:#fff}
.card.missed{background:#E4FBEF;border-style:dashed}
.card.missed .mark{font-size:.8rem;color:var(--good)}
.card.long{font-size:.98rem;font-weight:700;line-height:1.75}
.card:disabled{cursor:default}
.card:disabled:not(.right):not(.wrong):not(.missed){opacity:.55}

/* راهنمای مکعبی */
.coach{display:flex;gap:10px;align-items:center;margin:14px 0 10px}
.mascot{width:66px;height:66px;flex:none}
.mascot.happy{animation:hop .5s}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-14px)}}
.bubble{
  flex:1;background:#fff;border:4px solid var(--ink);padding:4px 12px;font-weight:800;font-size:1rem;
  box-shadow:inset 3px 3px 0 var(--hi), inset -3px -3px 0 var(--lo);
}

/* فلش‌کارت مرور */
.scene{perspective:1100px;margin:10px 6px 20px 4px}
.flip{position:relative;height:340px;cursor:pointer;transition:transform .5s;transform-style:preserve-3d}
.flip.is-flipped{transform:rotateY(180deg)}
.face{
  position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  background:var(--paper);border:4px solid var(--ink);border-radius:0;
  box-shadow:inset 4px 4px 0 var(--hi), inset -4px -4px 0 var(--lo), 6px 6px 0 var(--ink);
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;text-align:center;overflow:auto;
}
.face.back{transform:rotateY(180deg);align-items:stretch;justify-content:center;gap:10px}
.face .word{padding:0}
.face .hint{margin:10px 0 0;font-size:1rem;opacity:.75}
.face .lsn{margin:6px 0 0;font-size:.85rem;opacity:.6}
.row{display:flex;gap:10px;align-items:baseline;border-right:10px solid var(--c);padding:2px 12px;text-align:right}
.row .k{font-weight:900;color:var(--c);min-width:78px;flex:none}
.row .v{font-weight:700;font-size:1.05rem}
.nav{display:flex;gap:12px}
.nav button{flex:1}
.nav .secondary:disabled{opacity:.4;cursor:default}
.counter{text-align:center;font-weight:800;margin-bottom:2px;text-shadow:0 0 3px #fff,0 0 3px #fff}

/* انتخاب درس */
.picker-sub{margin:0 0 10px;font-weight:800;text-shadow:0 0 3px #fff,0 0 3px #fff}
.quick{display:flex;gap:10px;margin-bottom:10px}
.quick button{flex:1;background:var(--stone);border:4px solid var(--ink);padding:2px;font-weight:900;box-shadow:inset 0 3px 0 #EEF1F3, inset 0 -4px 0 var(--stone-d)}
.lesson{
  display:flex;align-items:center;gap:12px;width:100%;text-align:right;background:var(--paper);
  border:4px solid var(--ink);padding:7px 12px;margin-bottom:10px;font-weight:800;
  box-shadow:inset 3px 3px 0 var(--hi), inset -3px -3px 0 var(--lo), 0 4px 0 var(--ink);
}
.lesson.on{background:var(--sun)}
.chk{width:26px;height:26px;border:4px solid var(--ink);background:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:900;flex:none}
.ln{flex:1}
.lc{font-size:.85rem;opacity:.8;font-weight:700}
.cta{position:sticky;bottom:60px;padding:10px 0 4px;margin-top:auto}

/* نتیجه */
.result{text-align:center;display:flex;flex-direction:column;gap:10px;flex:1;justify-content:center}
.result .mascot{width:96px;height:96px;margin:0 auto}
.result .stars{font-size:3.2rem;color:var(--sun);-webkit-text-stroke:2px var(--ink);letter-spacing:6px}
.result h2{margin:0;font-size:1.7rem;font-weight:900;color:#fff;text-shadow:3px 3px 0 var(--ink),-1px -1px 0 var(--ink),1px -1px 0 var(--ink),-1px 1px 0 var(--ink)}
.result .big{font-size:1.15rem;font-weight:800;margin:0;text-shadow:0 0 3px #fff,0 0 3px #fff}
.earn{display:inline-flex;align-items:center;gap:8px;justify-content:center;font-weight:900;font-size:1.4rem;background:var(--paper);border:4px solid var(--ink);padding:2px 16px;margin:0 auto;box-shadow:inset 3px 3px 0 var(--hi), inset -3px -3px 0 var(--lo)}
.review{background:var(--paper);border:4px solid var(--ink);padding:8px 16px;text-align:right;box-shadow:inset 3px 3px 0 var(--hi), inset -3px -3px 0 var(--lo)}
.review h3{margin:2px 0 6px;font-size:1.05rem}
.review ul{margin:0;padding:0 18px 0 0}
.review li{margin:4px 0}
.up-msg{background:var(--sun);border:4px solid var(--ink);padding:4px 12px;font-weight:900;box-shadow:inset 3px 3px 0 #FFE88A, inset -3px -3px 0 #D99A00}
.bigprize{display:grid;gap:8px;justify-items:center}
.dance{animation:dance 1.1s ease-in-out infinite;transform-origin:50% 90%}
@keyframes dance{0%,100%{transform:rotate(-7deg) translateY(0)}50%{transform:rotate(7deg) translateY(-8px)}}

/* تنظیمات */
.fld{display:block;font-weight:800;margin-bottom:12px;background:var(--paper);border:4px solid var(--ink);padding:6px 10px}
.fld input{display:block;width:100%;margin-top:4px;padding:8px 10px;border:4px solid var(--ink);border-radius:0;background:#fff;font-size:1.05rem}

@media (prefers-reduced-motion:reduce){
  *{animation:none !important;transition:none !important}
}
</style>
</head>
<body>
<main id="app"></main>

<script>
/* =====================================================================
   بانک کلمات
   «# نام درس» شروع یک درس است.
   سه بخش: «## معنی»، «## متضاد»، «## هم‌خانواده»
   معنی:        کلمه: معنی
   متضاد:       کلمه ≠ مخالف
   هم‌خانواده:  کلمه = هم‌خانواده۱، هم‌خانواده۲
   شعر («## شعر»):  مصرع اول *** مصرع دوم :: معنی بیت
   متن («## متن»):  جمله :: معنی جمله
   مثل («## مثل»):  ضرب‌المثل :: مفهوم
   آرایه («## آرایه»):  عبارت یا بیت :: نام آرایه :: توضیح
   دستور («## دستور»):  پرسش :: پاسخ درست :: گزینهٔ غلط۱، گزینهٔ غلط۲
   برای اضافه‌کردن کلمه، فقط یک خط تازه در همان درس بنویس.
   ===================================================================== */
const BANK = `
# ستایش
## معنی
هستی: وجود، آفرینش، جهان
خاک: در این بیت به معنی انسان
از پی: به دنبال
بیم: ترس، خوف
کریم: بخشنده
چاره: تدبیر، راه حل
که: چه کسی
قبله: جهتی که ما نماز می‌خوانیم
ننوازی: محبت نکنی
مونس: همدم، یار
غمخوارگان: رنج دیدگان
بیچارگان: درماندگان، عاجزان
## متضاد
هستی ≠ نیستی
پیدا ≠ پنهان
ضعیف ≠ توانا
امید ≠ ناامیدی
یاور ≠ تنهایی
یار ≠ دشمن
غم ≠ شادی
بیچارگان ≠ توانمندان، سعادتمندان
## هم‌خانواده
ضعیف = ضعف، مستضعف
کریم = کرامت، تکریم
مونس = انس، انیس
## شعر
ای همه هستی ز تو پیدا شده *** خاک ضعیف از تو توانا شده :: ای خدایی که تمام هستی و جهان به خاطر وجود تو آفریده و آشکار شده است و انسان به خاطر وجود تو توانا و قدرتمند گشته است.
از پیِ توست این همه امید و بیم *** هم تو ببخشای و ببخش ای کریم :: این همه امید و آرزو و این همه ترس و بیم به خاطر توست. ای خدای بخشنده، هم گناهان ما را ببخش و هم چیزهای خوب را به ما عطا کن.
چاره‌ی ما ساز که بی‌یاوریم *** گر تو برانی، به که روی آوریم؟ :: خدایا چاره‌ساز و مشکل‌گشای کار ما باش که ما به جز تو یاوری نداریم. اگر تو به ما توجّه نکنی پس ما با چه کسی رازهایمان و دردهایمان را بگوییم؟
جز درِ تو، قبله نخواهیم ساخت *** گر ننوازی تو، که خواهد نواخت؟ :: به جز تو کسی را ستایش نمی‌کنیم و حاجتمان را فقط از تو می‌خواهیم. اگر تو ما را مورد لطف قرار ندهی هیچ‌کس نمی‌تواند به ما مهربانی و لطف کند.
یار شو، ای مونسِ غمخوارگان *** چاره کن ای چاره‌ی بیچارگان :: ای همدم و یار همه‌ی غم‌خوارها و مشکل‌دارها، یار و همدم ما باش و ای چاره‌ساز دردهای بیچارگان، مشکلات ما را رفع کن

# درس اول: تماشاخانه
## معنی
تماشاخانه: جایی که در آن چیزی نمایش داده می‌شود
سرشار: لبریز، پر
شگفتی‌ها: عجایب، پدیده‌های عجیب
پدیده: چیز تازه
لطیف: زیبا، نرم
عجیب: غریب، شگفت‌آور

ابر، آب داد بیخ درختان مُرده را *** شاخ برهنه، پیرهن نوبهار کرد :: ابر به خواست خدا ریشه‌ی درختان خشک و بی‌جان را آب داد و بهار و سبزه را در شاخه‌ی خشک و خالی درختان قرار داد. (بهار آمد.)

# خرد رهنمای و خرد دلگشای (شعر)
## متضاد

## شعر
به نام خداوند جان و خرد *** کزین برتر اندیشه برنگذرد :: به نام آفریدگار جان و اندیشه آغاز می‌کنم که اندیشه‌ای برتر و بهتر از این (شروع هر کاری با نام خدا) از ذهن انسان نمی‌گذرد.
خرد رهنمای و خرد دلگشای *** خرد، دست گیرد به هر دو سرای :: عقل، راهنما و دلگشا و کمک‌کنندهٔ انسان در هر دو جهان است.
به دانش گرای و بدو شو بلند *** چو خواهی که از بد نیابی گزند :: به علم و دانش روی بیاور و با آن رشد کن اگر می‌خواهی که از بدی‌ها آسیب نبینی.
ز نادان، بنالد دل سنگ و کوه *** ازیرا ندارد بَرِ کس، شکوه :: دل و جان سنگ و کوه نیز از نادان می‌نالد زیرا در نزد هیچ‌کس بزرگی و شکوه ندارد.
توانا بود، هر که دانا بُوَد *** ز دانش دل پیر، بُرنا بود :: هرکس که دانا و عاقل باشد، توانا و قدرتمند است و از دانش و دانایی حتّی دل انسان پیر نیز جوان می‌ماند.

اندوختن مال از راه پسندیده و تلاش برای مراقبت از آن. :: جمع کردن و ذخیره کردن ثروت و دارایی از راه درست و پسندیده و سعی و تلاش برای نگهداری و مراقبت از آن.
هر که در این چند خصلت، کاهلی بورزد، به مقصد نرسد. :: هر کس که در این چند ویژگی، تنبلی کند، به مقصد، سرانجام و هدف خود نمی‌رسد.
اگر مالی به دست آوَرَد و در نگهداری آن غفلت ورزد، زود تهیدست شود. :: اگر ثروت و پولی به‌دست بیاورد و در حفظ و نگهداری آن کوتاهی کند، زود فقیر می‌شود.
هر که در اندوختن مال دنیا فقط برای خود تلاش کند، در ردیف چارپایان است. :: هرکس در ذخیره کردن مال دنیا فقط برای خودش تلاش کند، مثل حیوانات و چارپایان است.
فروغ آتش را هر چه تلاش کنند کم شود، باز هم شعله‌ورتر می‌گردد. :: روشنایی و پرتو آتش را هر چه قدر هم تلاش کنند که کم شود، دوباره روشن‌تر و شعله‌ورتر می‌شود.
دانه هنگامی که در پردهی خاک نهان است، هیچ کس در پروردن آن تلاش نکند چون سر از خاک برآوَرد و روی زمین را آراست. معلوم گردد که چیست، در آن حال، بی‌شک آن را بپرورند و از آن بهره گیرند. :: هنگامی که دانه در زیر خاک پنهان است، هیچ‌کس در پرورش و رشد دادن آن تلاش نمی‌کند. وقتی که سر از خاک بیرون آورد و روی زمین را زیبا کرد، معلوم می‌شود که چیست. در آن حالت، بدون شک آن را پرورش می‌دهند و از آن استفاده می‌کنند.
موش، اگرچه با مردم هم‌خانه است، چون موذی است، او را از خانه بیرون اندازند و در هلاک آن کوشند. :: اگرچه موش با مردم در یک خانه است و در یک جا هستند، امّا چون موذی و آزاررساننده است او را از خانه بیرون می‌اندازند و در نابودی آن می‌کوشند.

## شعر
ای ایران، ای مرز پرگُهر *** ای خاکت سرچشمه‌ی هنر :: ای ایران، ای مرز گران‌قیمت، باارزش و پرگُهر. ای کشوری که خاکت سرچشمه و منشأ هنر و فضیلت است.
دور از تو اندیشه‌ی بدان *** پاینده مانی و جاودان :: اندیشه و فکر بدان و دشمنان از تو دور باد و همیشه پایدار و جاودان بمانی.
ای دشمن، ار تو سنگ خاره‌ای، من آهنم *** جان من فدای خاکِ پاک میهنم :: ای دشمن، اگر تو مثل سنگ خاره، محکم و سخت هستی، من هم مثل آهن، محکم هستم. جان من فدای خاک پاک و باارزش میهنم باد.
مهر تو چون شد پیشه‌ام *** دور از تو نیست اندیشه‌ام :: وقتی که مهر و محبّت به تو، کار و شغل من شد، فکر و اندیشه‌ی من از تو دور و جدا نیست. (من همیشه به تو فکر می‌کنم.)
در راه تو، کی ارزشی دارد این جانِ ما؟ *** پاینده باد، خاک ایران ما :: ای ایران، این جان ما در راه تو و برای تو ارزشی ندارد، امیدوارم این خاک ایران ما همیشه پاینده و استوار و جاودان باشد. (بماند.)
سنگِ کوهت درّ و گوهر است *** خاکِ دشتت بهتر از زر است :: سنگ کوه‌های تو مانند مروارید و گوهر، باارزش است و خاک دشت‌هایت از طلا بهتر و باارزش‌تر است.
مهرت از دل، کی برون کنم؟ *** برگو، بی‌مهر تو چون کنم؟ :: هیچ‌گاه نمی‌توانم مهر و محبّت تو را از دل بیرون کنم. بگو، بدون مهر و محبّت تو چگونه روزگار بگذرانم؟
تا گردش جهان و دور آسمان بپاست *** نور ایزدی همیشه رهنمای ماست :: تا زمانی که دنیا وجود دارد و گردش زمانه پایدار است (تا ابد) نور و الطاف خدایی همیشه راهنما و هدایت‌کننده‌ی ماست.
ایران، ای خرّم بهشت من *** روشن از تو سرنوشت من :: ای ایران، ای بهشت سرسبز و خرّم من، سرنوشت و تقدیر من از تو روشن‌تر و آشکارتر است.
گر آتش بارد به پیکرم *** جز مهرت در دل نَپرورم :: اگر در سخت‌ترین شرایط باشم و آتش مثل باران بر بدنم ببارد به جز مهر و محبّت تو هیچ چیزی در دلم پرورش نمی‌دهم.
از آب و خاک و مِهر تو سرشته شد دلم *** مهرت ار برون رود چه می‌شود دلم :: وجود من (دلم) با آب و خاک و مهر و محبّت تو آمیخته شد. اگر مهر و محبّت تو از وجودم بیرون برود دلم چه می‌شود؟ (اگر مهر و محبت و عشق تو از درونم بیرون رود، از بین خواهم رفت.)
## آرایه
در راه تو، کی ارزشی دارد این جانِ ما؟ *** پاینده باد، خاک ایران ما :: پرسش انکاری :: «کی ارزشی دارد» یعنی ارزشی ندارد
ایران، ای خرّم بهشت من *** روشن از تو سرنوشت من :: تشبیه :: ایران به بهشتِ خرّم مانند شده است
گر آتش بارد به پیکرم *** جز مهرت در دل نَپرورم :: کنایه :: «آتش بر پیکر باریدن» کنایه از قرار گرفتن در شرایط سخت است
## دستور
«خرّم بهشت» یعنی «بهشتِ خرّم». این چه نوع ترکیبی است؟ :: صفت و موصوف وارونه :: ترکیب اضافی، ترکیب عطفی

اسب سردار با یال فروریخته و دم برافراشته، پیش از اسب‌های دیگر، سوار خود را به بالا می‌کشاند. :: اسب آریوبرزن، سردار و فرمانده ایرانی، با موی گردنِ فروریخته‌اش و دم بالا برده‌اش جلوتر از اسب‌های دیگر، سوار خود را به بالا می‌کشاند و پیش می‌برد.
من، آریوبرزن، فرزند ایرانم؛ در آخرین سنگر، اینک تنم، جانم. :: من، آریوبرزن، سردار ایرانی و فرزند میهن عزیزم ایران هستم که در آخرین سنگر زندگی‌ام قرار گرفته‌ام؛ اکنون این تن و جان من برای فدا شدن در راه ایران آماده است.
آیا باید تسلیم شد و چیرگی دشمن را بر خانمان دید و خواری و خفّت را به جان خرید یا جنگید و خاک وطن را از خون خود گلگون کرد؟ :: آیا باید در مقابل دشمن تسلیم شد و برتری او را بر کشور دید و تحقیر و کوچک شدن با همهٔ وجود را پذیرفت، یا با دشمن جنگید و با جان‌فشانی و خون خود، خاک وطن را سرخ رنگ کرد؟
آریوبرزن با شمار اندکی از سپاهیان خود، به سپاه عظیم دشمن، یورش برد. گروهی بسیار از آنان را به خاک افکند. :: آریوبرزن با تعداد اندکی از سپاهیانش به سپاه بزرگ دشمن حمله کرد و بسیاری از آنان را کشت.

یکی از بزرگان، بیمار شده بود، چنان که تصوّر می‌کرد، گاو شده است. پس همه روز، بانگ می‌کرد و این و آن را می‌گفت: «مرا بکُشید که از گوشت من هَریسه، نیکو آید». :: روزی روزگاری یکی از بزرگان بیمار شد و توهم می‌زد که گاو شده است. او مدام فریاد می‌زد: «مرا بکشید و از گوشتم حلیم بپزید، خیلی خوشمزه می‌شود!»
کار او به درجه‌ای بکشید که هیچ نمی‌خورد و اطبّا در معالجت عاجز ماندند. سرانجام، خواجه ابوعلی سینا را آوردند تا او را علاج کند. :: وضعیت بیمار آن‌قدر بد شده بود که غذایی نمی‌خورد و هیچ پزشکی نتوانست او را درمان کند. در نهایت ابوعلی سینا را آوردند.
جوان، همچو گاو، بانگی کرد، یعنی اینجا هستم! :: بیماری که توهم گاو بودن داشت، مثل گاو صدا کرد و گفت: «من این‌جا هستم!»
خواجه بوعلی گفت: «او را به میان سرای آورید و دست و پای او را ببندید و بخوابانید». :: ابوعلی سینا دستور داد که بیمار را به وسط حیاط بیاورند، دست و پایش را ببندند و او را به زمین بخوابانند.
بیمار چون آن شنید، بدوید و جلو آمد، و بر پهلوی راست، خُفت و پای او سخت ببستند. :: بیمار که این حرف‌ها را شنید، سریع جلو آمد و روی زمین دراز کشید و پای بیمار را محکم بستند.
پس خواجه بوعلی بیامد و کارد بر کارد مالید و نشست و دست بر پهلوی او نهاد، چنان که عادت قصّابان باشد. پس گفت: «وه! این چه گاو لاغری است! این را نمی‌توان کشت، علف دهیدش تا فَربه شود». :: خواجه ابوعلی چاقوها را روی هم کشید و وانمود کرد که می‌خواهد گاو را قصابی کند. او در حالی که دستش را روی پهلوی بیمار می‌گذاشت، گفت: «وای! این گاو خیلی لاغر است! نمی‌شود آن را کشت. باید به او علف بدهیم تا چاق شود!»
پس، خواجه، برخاست و بیرون آمد و حاضران را گفت: «دست و پای او را بگشایید و خوردنی، آنچه فرمایم پیش او برید و او را گویید: بخور تا زود فربه شوی». :: سپس خواجه ابوعلی از اتاق خارج شد و به اطرافیان بیمار گفت: «دست و پای او را باز کنید و به او غذا بدهید. به او بگویید که باید بخورد تا چاق شود.»
چنان کردند که خواجه گفت. خوردنی پیش او بردند و او می‌خورد، بدان امید که فربه شود، تا او را بکشند. :: حاضران طبق دستور خواجه ابوعلی عمل کردند. بیمار با اشتیاق شروع به خوردن کرد، زیرا امیدوار بود که چاق شود و او را نکشند.
پس، یک ماه سپری شد و چنان که خواجه بوعلی فرموده بود، کاملاً صحّت یافت. :: یک ماه گذشت و بیمار، همان‌طور که خواجه ابوعلی گفته بود، به طور کامل سلامتی خود را به دست آورد.
مرا بکشید که از گوشت من هَریسه، نیکو آید. :: مرا قربانی کنید که از گوشت من آشی (حلیمی) خوب به‌دست می‌آید.
اطبّا در معالجت عاجز ماندند. :: پزشکان در درمان ناتوان ماندند.
علف دهیدش تا فَربه شود. :: به او علف بدهید تا چاق شود.
## مثل
قدر عافیت، کسی داند که به مصیبتی گرفتار آید. :: انسان زمانی قدر دوران راحتی و آسایش را می‌داند و شکر می‌کند که مشکلی برایش پیش بیاید.
بخور تا توانی به بازوی خویش. :: سعی کن از مزد و حقوقی استفاده کنی که خودت با زحمت خودت به دست آورده‌ای.
هر سخن جایی و هر نکته، مکانی دارد. :: هر حرف و سخنی را هر جایی و پیش هر کسی نباید گفت و اول باید شرایط را در نظر گرفت.
عقل سالم در بدن سالم است. :: زمانی که جسم انسان سالم باشد و دردی نداشته باشد، عقل و درایت انسان خوب کار می‌کند.
بخور بخواب، کار من است؛ خدا نگاه‌دار من است. :: این مثل برای انسان‌های تنبلی به کار می‌رود که دنبال کار و تلاش نمی‌روند و از خدا روزی و آسایش می‌خواهند.

پیش پای او به رسم پیشواز *** ابر با رنگین‌کمان، پل می‌زند :: به رسم پیشواز و استقبال، رنگین‌کمان بر سر راه او پل زیبایی ایجاد می‌کند.
باغبان هم، باغبان نوبهار *** بر سر هر شاخه‌ای گل می‌زند :: باغبان نوبهار (خداوند) بر سر هر شاخه‌ای گل می‌رویاند.
تا می‌آید، پرده‌ها از خانه‌ها *** باز توی کوچه‌ها سر می‌کشند :: تا سوار سبزپوش می‌آید، دوباره پرده‌های خانه‌ها به کوچه سر می‌کشند.
مرغ‌های خسته و پر بسته هم *** از میان پرده‌ها پر می‌کشند :: مرغ‌های خسته و پربسته و اسیر هم از بین پرده‌ها آزاد می‌شوند و پرواز می‌کنند.

هر کجا سرگرم صحبت می‌شوند *** شاخه‌ها درباره‌ی گنجشک‌ها :: در هر جایی شاخه‌ها درباره‌ی گنجشک‌ها حرف می‌زنند. (گنجشک‌ها بر سر شاخه‌ها می‌نشینند.)

## شعر
به راهی در، سلیمان دید موری *** که با پای ملخ می‌کرد زوری :: سلیمان (ع) در راهی، مورچه‌ای را دید که با پای یک ملخ، دست‌و‌پنجه نرم می‌کرد و زور می‌زد.
به زحمت، خویش را هر سو کشیدی *** وزان بار گران، هر دَم خمیدی :: مورچه با زحمت خود را به هر سو می‌کشید و از آن بارِ سنگین (ملخ) هر لحظه به طرفی خم می‌شد.
ز هر گردی، برون افتادی از راه *** ز هر بادی، پریدی چون پر کاه :: با هر گرد و غباری از راه اصلی خود خارج می‌شد و با هر بادی مثل پر کاه جابه‌جا می‌شد.
چنان بگرفته راه سعی در پیش *** که فارغ گشته از هر کس، جز از خویش :: آن‌چنان سعی و تلاش می‌کرد که به‌جز خودش به فکر کسی نبود.
به تندی گفت: «کای مسکین نادان *** چرایی فارغ از مُلک سلیمان؟» :: سلیمان با تندی به او گفت: «که ای بیچارهٔ نادان چرا از سرزمین سلیمان غافلی؟»
بیا زین ره، به قصر پادشاهی *** بخور در سفرهٔ ما، هر چه خواهی :: از این راه به قصر پادشاهی ما بیا و در سفرهٔ ما هر چیزی که می‌خواهی بخور.
چرا باید چنین خونابه خوردن *** تمام عمرِ خود را بار بردن :: چرا باید این‌چنین رنج و سختی بکشی و تمام عمر خود را بار جابه‌جا کنی؟
ره است اینجا و مردم رهگذارند *** مبادا بر سرت پایی گذارند :: این‌جا سر راه است و مردم در حال گذشتن هستند، مبادا (نکند) پایشان را بر روی تو بگذارند.
مکش بیهوده این بار گران را *** میازار از برای جسم، جان را :: بیهوده این بار سنگین را حمل نکن و جانت را برای جسم آزار نده.
بگفت: «از سور، کمتر گوی با مور *** که موران را، قناعت خوشتر از سور :: گفت: از جشن و شادی و سور و راحتی کمتر با مورچه حرف بزن، زیرا برای مورچه‌ها صرفه‌جویی و خرسندی از جشن و مهمانی خوش‌تر و بهتر است.
نیفتد با کسی ما را سر و کار *** که خود، هم توشه داریم و هم انبار :: سر و کار ما با کسی نمی‌افتد (محتاج کسی نمی‌شویم)، زیرا خودمان هم غذا (ذخیره) داریم، هم جایی برای نگهداری آن (انبار).
مرا امید راحت‌هاست زین رنج *** من این پای ملخ، ندهم به صد گنج :: من از این همه رنج و سختی آرزوی آسودگی و راحتی دارم و این پای ملخ به ظاهر کم‌ارزش را به صد گنج نمی‌دهم.
گَرَت همواره باید کامکاری *** ز مور آموز رسم بُردباری :: اگر همواره برای تو پیروزی و کامروایی لازم است، پس از مورچه، روش صبر و پایداری را یاد بگیر.
مرو راهی که پایت را ببندند *** مکن کاری که هُشیاران بخندند :: به راهی نرو که گرفتارت کنند و کاری انجام نده که انسان‌های هشیار و عاقل به تو بخندند. (تو را مسخره کنند.)
گهِ تدبیر، عاقل باش و بینا *** ره امروز را مسپار فردا :: هنگام اندیشه و فکر، عاقل و بینا باش و کار امروز را به فردا نسپار.
بکوش اندر بهارِ زندگانی *** که شد پیرایه‌ی پیری، جوانی :: در دورهٔ جوانی تلاش کن، زیرا جوانی زینت و زیور و زیبایی دورهٔ پیری است.

برو کارگر باش و امّیدوار *** که از یأس، جز مرگ، ناید به بار :: پس برو برای هدفت کار کن و همیشه امیدوار باش که از ناامیدی چیزی به جز نابودی و مرگ به دست نمی‌آید.

# نیایش (شعر)
## شعر
این درختانند همچون خاکیان *** دست‌ها برکرده‌اند از خاکدان :: این درختان مانند انسان‌ها دست‌های نیاز خود را از این جهان بالا آورده‌اند.
با زبان سبز و با دست دراز *** از ضمیر خاک، می‌گویند راز :: با زبان گویا و با دستی بالا آمده به سوی خدا از درون خاک، با خداوند راز و نیاز می‌کنند.
## متن
یا رب، لطف و رحمت خود را از ما باز مگیر. :: خداوندا، ما را مورد لطف و مهربانی خودت، قرار بده.
و دل‌های ما را به پرتوِ معرفتِ خود، روشن دار. :: وجود (درون) همه‌ی ما را با نور شناخت خودت، روشن بکن. (ما را به راهِ درست هدایت گردان.)
پروردگارا، ما را بدان نوری بپروَر که بندگان نیک خود را پروَردی. :: ای خدا، ما را با همان نوری پرورش بده که بندگان خوب و نیک خودت را پرورش دادی و هدایت کردی.
مَلِکا، غافلان را به لطفِ خود بیدار گردان. :: پروردگارا، با لطف خود، بی‌خبران را آگاه کن.
## متضاد
خاکیان ≠ آسمانیان
دراز ≠ کوتاه
رحمت ≠ خشم
روشن ≠ تاریک
نور ≠ ظلمت، تاریکی
بندگان ≠ اربابان
نیک ≠ بد
غافلان ≠ آگاهان، هوشیاران
بیدار ≠ خواب
## آرایه
این درختانند همچون خاکیان *** دست‌ها برکرده‌اند از خاکدان :: تشبیه :: درختان به انسان‌ها (خاکیان) مانند شده‌اند
این درختانند همچون خاکیان *** دست‌ها برکرده‌اند از خاکدان :: تشخیص :: به درختان دست نسبت داده شده است
این درختانند همچون خاکیان *** دست‌ها برکرده‌اند از خاکدان :: قافیه :: «خاکیان» و «خاکدان» هم‌قافیه‌اند (ردیف ندارد)
مَلِکا، غافلان را به لطفِ خود بیدار گردان. :: تشبیه :: خداوند به «مَلِک» (پادشاه) مانند شده است
## دستور
بیت «این درختانند همچون خاکیان / دست‌ها برکرده‌اند از خاکدان» از چند جمله تشکیل شده است؟ :: ۲ جمله :: ۱ جمله، ۳ جمله

## معنی

## شعر
باد سرد، آرام بر صحرا گذشت *** سبزه‌زاران، رفته رفته، زرد گشت :: باد سردی آرام آرام در صحرا وزید و کم‌کم سبزه‌ها و چمنزارها زرد شد.
تک درخت نارون، شد رنگ رنگ *** زرد شد آن چتر شاداب و قشنگ :: برگ‌های تک درخت نارون، رنگارنگ شد و آن برگ‌های چتر مانند شاداب و زیبایش، زرد شد.
برگ برگ گل به رقص باد ریخت *** رشته‌های بیدبُن از هم گسیخت :: با وزش باد، برگ‌های گل یکی یکی بر زمین ریخت و رشته‌های درخت بید از هم جدا شد.
چشمه کم کم خشک شد، بی‌آب شد *** باغ و بُستان، ناگهان در خواب شد :: کم‌کم چشمه خشک و بی‌آب شد و ناگهان تمام باغ‌ها و بستان‌ها به خواب زمستانی رفتند.
کرد دهقان، دانه‌ها در زیر خاک *** کرد کوته، شاخه‌ی پیچانِ تاک :: کشاورز دانه‌ها را در زیر خاک کاشت و شاخه‌های بلند پیچ در پیچ درخت انگور را کوتاه کرد.
فصل پاییز و زمستان می‌رود *** بار دیگر، چون بهاران می‌شود :: فصل پاییز و زمستان سپری می‌شود و یک بار دیگر، همه‌جا مانند بهار می‌شود.
از زمین خشک، می‌روید گیاه *** چشمه می‌جوشد، آب می‌افتد به راه :: از زمین خشک گیاه می‌روید و چشمه‌ها می‌جوشند و آب آن‌ها روان می‌شود.
برگ نو آرَد، درخت نارون *** سبز گردد، شاخساران کهن :: درخت نارون دوباره برگ تازه می‌رویاند و شاخه‌های بزرگ قدیمی سبز می‌شوند.
گل بخندد، بر سرِ گل‌بوته‌ها *** پُر کند بوی خوش گل، باغ را :: بر سر بوته‌های گل، غنچه‌ای شکوفا می‌شود و بوی خوش این گل، باغ را پر می‌کند.
باز می‌آید پرستو، نغمه‌خوان *** باز می‌سازد در این‌جا آشیان :: دوباره پرستو آوازخوان و شاد می‌آید و در این باغ لانه می‌سازد.

let ac = null;
function beep(freqs, dur = 0.12) {
  if (!save.sound) return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const t = ac.currentTime;
    freqs.forEach((f, i) => {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = 'triangle'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t + i * dur);
      g.gain.exponentialRampToValueAtTime(0.25, t + i * dur + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + i * dur + dur);
      o.connect(g); g.connect(ac.destination);
      o.start(t + i * dur); o.stop(t + i * dur + dur + 0.03);
    });
  } catch (e) {}
}

/* ------------------------- خواندن بانک کلمات ------------------------- */
function parseBank(text) {
  const lessons = [];
  let L = null, sec = null;
  for (const raw of text.split('\n')) {
    const line = raw.trim();
    if (!line) continue;
    if (line.startsWith('# ')) {
      L = { name: line.slice(2).trim(), meaning: [], antonym: [], family: [], poem: [], text: [], device: [], grammar: [], proverb: [] };
      lessons.push(L); sec = null; continue;
    }
    if (line.startsWith('## ')) {
      const h = line.slice(3);
      sec = h.includes('مثل') ? 'proverb' : h.includes('آرایه') ? 'device' : h.includes('دستور') ? 'grammar' : h.includes('شعر') ? 'poem' : h.includes('متن') ? 'text' : h.includes('معنی') ? 'meaning' : h.includes('متضاد') ? 'antonym' : 'family';
      continue;
    }
    if (!L || !sec) continue;
    if (sec === 'poem' || sec === 'text') {
      const parts = line.split('::').map(s => s.trim());
      if (parts.length < 2 || !parts[0] || !parts[1]) continue;
      if (sec === 'poem') {
        const h = parts[0].split('***').map(s => s.trim()).filter(Boolean);
        if (h.length !== 2) continue;
        L.poem.push({ h, m: parts[1] });
      } else {
        L.text.push({ h: [parts[0]], m: parts[1], prose: true });
      }
    } else if (sec === 'proverb') {
      const p = line.split('::').map(s => s.trim());
      if (p.length < 2 || !p[0] || !p[1]) continue;
      L.proverb.push({ p: p[0], m: p[1] });
    } else if (sec === 'device') {
      const p = line.split('::').map(s => s.trim());
      if (p.length < 2 || !p[0] || !p[1]) continue;
      L.device.push({ h: p[0].split('***').map(s => s.trim()).filter(Boolean), name: p[1], note: p[2] || '' });
    } else if (sec === 'grammar') {
      const p = line.split('::').map(s => s.trim());
      if (p.length < 2 || !p[0] || !p[1]) continue;
      L.grammar.push({ q: p[0], a: p[1], wrong: (p[2] || '').split('،').map(s => s.trim()).filter(Boolean) });
    } else if (sec === 'meaning') {
      const i = line.indexOf(':');
      if (i < 1) continue;
      L.meaning.push({ w: line.slice(0, i).trim(), a: line.slice(i + 1).trim() });
    } else if (sec === 'antonym') {
      const p = line.split('≠').map(s => s.trim());
      if (p.length < 2 || !p[0] || !p[1]) continue;
      L.antonym.push({ w: p[0], a: p[1] });
    } else {
      const i = line.indexOf('=');
      if (i < 1) continue;
      const members = line.slice(i + 1).split(/[،,]/).map(s => s.trim()).filter(Boolean);
      if (!members.length) continue;
      L.family.push({ w: line.slice(0, i).trim(), members });
    }
  }
  lessons.forEach(L => {
    for (const k of ['meaning', 'antonym']) {
      const s = new Set();
      L[k] = L[k].filter(e => { const key = norm(e.w) + '|' + norm(e.a); if (s.has(key)) return false; s.add(key); return true; });
    }
    const s = new Set();
    L.family = L.family.filter(e => { const key = norm(e.w) + '|' + e.members.map(norm).join(','); if (s.has(key)) return false; s.add(key); return true; });
    const sp = new Set();
    L.poem = L.poem.filter(p => { const key = norm(p.h.join('')); if (sp.has(key)) return false; sp.add(key); return true; });
    const st = new Set();
    L.text = L.text.filter(p => { const key = norm(p.h.join('')); if (st.has(key)) return false; st.add(key); return true; });
    const spv = new Set();
    L.proverb = L.proverb.filter(p => { const key = norm(p.p); if (spv.has(key)) return false; spv.add(key); return true; });
  });
  return lessons;
}
const LESSONS = parseBank(BANK);
const FILL_IDS = LESSONS.map((L, i) => (L.poem.length ? i : -1)).filter(i => i >= 0);
const MEANING_IDS = LESSONS.map((L, i) => (L.poem.length || L.text.length ? i : -1)).filter(i => i >= 0);
const VERSES = LESSONS.reduce((a, L) => a + L.poem.length, 0);
const TEXTS = LESSONS.reduce((a, L) => a + L.text.length, 0);
const PROVERB_IDS = LESSONS.map((L, i) => (L.proverb.length ? i : -1)).filter(i => i >= 0);
const PROVERBS = LESSONS.reduce((a, L) => a + L.proverb.length, 0);

const MEANS = new Map(), ANTS = new Map();
const addTo = (m, k, v) => { const key = norm(k); if (!m.has(key)) m.set(key, new Set()); m.get(key).add(norm(v)); };
LESSONS.forEach(L => {
  L.meaning.forEach(e => addTo(MEANS, e.w, e.a));
  L.antonym.forEach(e => { addTo(ANTS, e.w, e.a); addTo(ANTS, e.a, e.w); });
});
// گروه‌بندی هم‌خانواده‌ها (اگر دو کلمه در یک خانواده بودند، هرگز گزینه‌ی غلط هم نمی‌شوند)
const parent = new Map();
const find = x => {
  if (!parent.has(x)) parent.set(x, x);
  while (parent.get(x) !== x) { parent.set(x, parent.get(parent.get(x))); x = parent.get(x); }
  return x;
};
const union = (a, b) => parent.set(find(a), find(b));
LESSONS.forEach(L => L.family.forEach(e => e.members.forEach(m => union(norm(e.w), norm(m)))));

const wordCount = L => new Set([...L.meaning.map(e => norm(e.w)), ...L.antonym.map(e => norm(e.w)), ...L.family.map(e => norm(e.w))]).size;
const TOTAL_WORDS = new Set(LESSONS.flatMap(L => [...L.meaning.map(e => norm(e.w)), ...L.antonym.map(e => norm(e.w)), ...L.family.map(e => norm(e.w))])).size;

/* ---------------------------- ساخت سؤال‌ها ---------------------------- */
function pool(type, ids) {
  const set = new Set();
  (ids || LESSONS.map((_, i) => i)).forEach(i => {
    const L = LESSONS[i];
    if (type === 'meaning') L.meaning.forEach(e => set.add(e.a));
    else if (type === 'antonym') L.antonym.forEach(e => set.add(e.a));
    else L.family.forEach(e => e.members.forEach(m => set.add(m)));
  });
  return [...set];
}
function candidates(ids) {
  const c = [];
  ids.forEach(i => {
    const L = LESSONS[i];
    L.meaning.forEach(e => c.push({ type:'meaning', w:e.w, answers:[e.a] }));
    L.antonym.forEach(e => c.push({ type:'antonym', w:e.w, answers:[e.a] }));
    L.family.forEach(e => c.push({ type:'family', w:e.w, answers:e.members }));
    L.device.forEach(e => c.push({ type:'device', w:e.h.join(' / '), h:e.h, answers:[e.name], note:e.note }));
    L.grammar.forEach(e => c.push({ type:'grammar', w:e.q, answers:[e.a], wrong:e.wrong }));
  });
  const seen = new Set();
  return c.filter(x => {
    const k = x.type + '|' + norm(x.w) + '|' + x.answers.map(norm).join(',');
    if (seen.has(k)) return false;
    seen.add(k); return true;
  });
}
function pickQuestions(cands, n) {
  const byType = { meaning:[], antonym:[], family:[], device:[], grammar:[] };
  shuffle(cands).forEach(c => byType[c.type].push(c));
  const out = [], used = new Set();
  const types = Object.keys(byType).filter(t => byType[t].length);
  for (const pass of [1, 2]) {
    let progress = true;
    while (out.length < n && progress) {
      progress = false;
      for (const t of shuffle(types)) {
        if (out.length >= n) break;
        const arr = byType[t];
        const idx = arr.findIndex(c => pass === 2 || !used.has(norm(c.w)));
        if (idx >= 0) {
          const [c] = arr.splice(idx, 1);
          used.add(norm(c.w)); out.push(c); progress = true;
        }
      }
    }
  }
  return shuffle(out);
}
function pickWrong(type, avoid, isBad, ids, need, refLen) {
  const build = arr => {
    const seen = new Set(avoid), out = [];
    shuffle(arr).forEach(v => { const k = norm(v); if (!seen.has(k) && !isBad(v)) { seen.add(k); out.push(v); } });
    return out;
  };
  let cand = build(pool(type, ids));
  if (cand.length < need) cand = build(pool(type, null));
  cand.sort((a, b) => Math.abs(a.length - refLen) - Math.abs(b.length - refLen));
  return shuffle(cand.slice(0, Math.max(need * 3, 6))).slice(0, need);
}
function makeQuestion(c, ids) {
  const nw = norm(c.w);
  if (c.type === 'device') {
    const correct = c.answers[0];
    const nc = norm(c.h.join(''));
    const used = new Set(LESSONS.flatMap(L => L.device
      .filter(e => { const ne = norm(e.h.join('')); return ne.includes(nc) || nc.includes(ne); })
      .map(e => norm(e.name))));
    used.add(norm(correct));
    const taught = ['تشبیه', 'تشخیص', 'کنایه', 'پرسش انکاری', 'قافیه'];
    const all = [...new Set([...taught, ...LESSONS.flatMap(L => L.device.map(e => e.name))])];
    // «قافیه» تقریباً در هر بیتی هست، پس هرگز گزینهٔ غلط نمی‌شود
    const wrong = shuffle(all.filter(n => !used.has(norm(n)) && norm(n) !== norm('قافیه'))).slice(0, 2);
    return { type:'device', kind:'cards', w:c.w, hems:c.h, answers:[correct], options: shuffle([correct, ...wrong]), note:c.note, ask:'در همین عبارت کدام آرایهٔ ادبی به کار رفته است؟' };
  }
  if (c.type === 'grammar') {
    const correct = c.answers[0];
    let wrong = c.wrong.filter(x => norm(x) !== norm(correct));
    if (wrong.length < 2) {
      const extra = shuffle(LESSONS.flatMap(L => L.grammar.map(e => e.a))
        .filter(a => norm(a) !== norm(correct) && !wrong.some(w => norm(w) === norm(a))));
      wrong = [...wrong, ...extra];
    }
    wrong = wrong.slice(0, 2);
    return { type:'grammar', kind:'cards', w:c.w, answers:[correct], options: shuffle([correct, ...wrong]), ask:'گزینهٔ درست را انتخاب کن.' };
  }
  if (c.type === 'family') {
    const members = shuffle(c.answers);
    const multi = members.length >= 2 && Math.random() < 0.6;
    const correct = multi ? members.slice(0, Math.min(3, members.length)) : [members[0]];
    const comp = new Set([find(nw), ...correct.map(m => find(norm(m)))]);
    const isBad = v => comp.has(find(norm(v))) || norm(v) === nw;
    const need = (multi ? 5 : 3) - correct.length;
    const wrong = pickWrong('family', correct.map(norm), isBad, ids, need, correct[0].length);
    return {
      type:'family', kind: multi ? 'multi' : 'cards', w:c.w, answers:correct,
      options: shuffle([...correct, ...wrong]),
      ask: multi ? `همهٔ کلمه‌های هم‌خانوادهٔ «${c.w}» را تیک بزن` : `کدام کلمه هم‌خانوادهٔ «${c.w}» است؟`
    };
  }
  const correct = c.answers[0];
  const banned = new Set([nw, norm(correct)]);
  (MEANS.get(nw) || []).forEach(x => banned.add(x));
  if (c.type === 'antonym') (ANTS.get(nw) || []).forEach(x => banned.add(x));
  const wrong = pickWrong(c.type, [norm(correct)], v => banned.has(norm(v)), ids, 2, correct.length);
  return {
    type:c.type, kind:'cards', w:c.w, answers:[correct], options: shuffle([correct, ...wrong]),
    ask: c.type === 'meaning' ? `معنی «${c.w}» کدام است؟` : `مخالف «${c.w}» کدام است؟`
  };
}
const buildQuestions = (ids, n) => pickQuestions(candidates(ids), n).map(c => makeQuestion(c, ids));

/* ---- معنی شعر ---- */
function poemPool(ids) {
  const out = [];
  ids.forEach(i => LESSONS[i].poem.forEach(p => out.push(p)));
  return out;
}
function meanPool(ids) {
  const out = [];
  ids.forEach(i => { LESSONS[i].poem.forEach(p => out.push(p)); LESSONS[i].text.forEach(p => out.push(p)); });
  return out;
}
function buildPoemQuestions(ids, n) {
  return shuffle(meanPool(ids)).slice(0, n).map(v => {
    const mine = norm(v.m);
    const build = arr => [...new Set(arr.filter(p => norm(p.m) !== mine).map(p => p.m))];
    const same = list => list.filter(p => !!p.prose === !!v.prose);
    let cand = build(same(meanPool(ids)));
    if (cand.length < 2) cand = build(meanPool(ids));
    if (cand.length < 2) cand = build(same(meanPool(MEANING_IDS)));
    cand.sort((a, b) => Math.abs(a.length - v.m.length) - Math.abs(b.length - v.m.length));
    const wrong = shuffle(cand.slice(0, 4)).slice(0, 2);
    return {
      type:'poem', kind:'cards', prose: !!v.prose, w:v.h[0], hems:v.h, answers:[v.m],
      options: shuffle([v.m, ...wrong]),
      ask: v.prose ? 'معنی این جمله کدام است؟' : 'معنی این بیت کدام است؟'

}

/* ---- حفظ شعر (جای خالی) ---- */
const STOP = new Set(['این', 'آن', 'که', 'را', 'برای', 'همه', 'هم', 'بود', 'شد', 'است']);
function tokenize(h) {
  return h.split(/\s+/).filter(Boolean).map(t => {
    const m = t.match(/^([«»"'(]*)(.*?)([،,؛;:؟?!.…»"')]*)$/);
    return { pre:m[1], core:m[2], suf:m[3] };
  }).filter(t => t.core);
}
function proverbPool(ids) {
  const out = [];
  ids.forEach(i => LESSONS[i].proverb.forEach(p => out.push({ h: [p.p], m: p.m })));
  return out;
}
function makeFill(v, ids, kind) {
  const isProv = kind === 'proverb';
  const hems = v.h.map(tokenize);
  const total = hems.reduce((a, t) => a + t.length, 0);
  const k = isProv ? (total >= 6 ? 2 : 1) : (total >= 11 ? 3 : 2);
  const cand = hems.map((toks, hi) => toks
    .map((t, ti) => ({ hi, ti, len: norm(t.core).length }))
    .filter(c => c.len >= 3 && !STOP.has(norm(hems[c.hi][c.ti].core))));
  const picks = [], taken = new Set();
  const pickFrom = arr => {
    const sorted = shuffle(arr).sort((a, b) => (b.len >= 4) - (a.len >= 4));
    for (const c of sorted) {
      const n = norm(hems[c.hi][c.ti].core);
      if (!taken.has(n)) { taken.add(n); picks.push(c); return true; }
    }
    return false;
  };
  cand.forEach(arr => pickFrom(arr));
  while (picks.length < k) {
    const rest = cand.flat().filter(c => !picks.some(p => p.hi === c.hi && p.ti === c.ti));
    if (!pickFrom(rest)) break;
  }
  picks.sort((a, b) => a.hi - b.hi || a.ti - b.ti);
  const slots = picks.map(c => ({ hi:c.hi, ti:c.ti, ans: hems[c.hi][c.ti].core }));
  const answers = slots.map(s => s.ans);
  const banned = new Set(hems.flat().map(t => norm(t.core)));
  const avg = answers.reduce((a, x) => a + x.length, 0) / answers.length;
  const poolFor = list => {
    const map = new Map();
    list.forEach(p => p.h.forEach(h => tokenize(h).forEach(t => {
      const n = norm(t.core);
      if (n.length >= 3 && !banned.has(n) && !STOP.has(n) && !map.has(n)) map.set(n, t.core);
    })));
    return [...map.values()];
  };
  const poolList = isProv ? proverbPool : poemPool;
  let dist = poolFor(poolList(ids));
  if (dist.length < 4) dist = poolFor(poolList(isProv ? PROVERB_IDS : FILL_IDS));
  dist.sort((a, b) => Math.abs(a.length - avg) - Math.abs(b.length - avg));
  const wrong = shuffle(dist.slice(0, 8)).slice(0, 2);
  return {
    type: isProv ? 'proverb' : 'fill', kind:'fill', w:v.h.join(' '), hems, slots, answers,
    chips: shuffle([...answers, ...wrong]),
    note: isProv ? v.m : '', hint: isProv ? v.m : '',
    ask: isProv ? 'جای خالی را طوری پر کن که ضرب‌المثل کامل شود' : 'جای خالی را با کلمهٔ درست پر کن'
  };
}
const buildFillQuestions = (ids, n) => shuffle(poemPool(ids)).slice(0, n).map(v => makeFill(v, ids, 'poem'));
const buildProverbQuestions = (ids, n) => shuffle(proverbPool(ids)).slice(0, n).map(v => makeFill(v, ids, 'proverb'));

  return `<svg class="px ${cls}" width="${s}" height="${Math.round(s * h / w)}" viewBox="0 0 ${w} ${h}" shape-rendering="crispEdges" aria-hidden="true">${r}</svg>`;
};

    else if (!picked && good) { b.classList.add('missed'); b.querySelector('.mark').textContent = 'جا افتاد'; missed++; }
  });
  document.getElementById('check').classList.add('hidden');
  const kind = wrongPicked > 0 ? 'lose' : missed > 0 ? 'almost' : 'win';
  settle(q, kind, Math.round(save.gain * 1.5), document.getElementById('cards'));
}

/* حفظ شعر: جای خالی */
function renderFillQ() {
  const q = quiz.qs[quiz.i], t = TYPES[q.type];
  quiz.done = false;
  quiz.fill = { vals: q.slots.map(() => null), used: q.chips.map(() => false), active: 0 };
  const hemHtml = q.hems.map((toks, hi) => `<span class="hem">${toks.map((tk, ti) => {
    const s = q.slots.findIndex(x => x.hi === hi && x.ti === ti);
    return s >= 0
      ? `${esc(tk.pre)}<button class="slot" data-s="${s}" style="min-width:${Math.max(3, tk.core.length) * 0.62 + 1}em" aria-label="جای خالی ${fa(s + 1)}"></button>${esc(tk.suf)}`
      : esc(tk.pre + tk.core + tk.suf);
  }).join(' ')}</span>`).join('');
  app.innerHTML = `
    ${hud(quiz.i, quiz.qs.length, true)}
    <section class="qcard" id="qcard" style="--c:${t.color}">
      <div class="tag">${t.label}</div>
      <div class="verse">${hemHtml}</div>
      <p class="ask">${q.ask}</p>
      ${q.hint ? `<p class="sub">مفهوم: ${esc(q.hint)}</p>` : ''}
    </section>
    <div class="bank" id="bank">
      ${q.chips.map((c, j) => `<button class="chip" style="--i:${j}" data-c="${j}">${esc(c)}</button>`).join('')}
    </div>
    <div class="ans" id="ans"></div>
    <div class="coach" id="coach">${owl('idle')}<div class="bubble">یک کلمه را بزن تا در جای خالی بنشیند. برای برداشتنش، جای خالی را بزن.</div></div>
    <button class="primary" id="check" disabled>بررسی</button>
    <button class="primary hidden" id="next"></button>`;
  document.getElementById('home').onclick = renderHome;
  const slots = [...app.querySelectorAll('.slot')], chips = [...app.querySelectorAll('.chip')];
  const sync = () => {
    const f = quiz.fill;
    slots.forEach(b => {
      const s = +b.dataset.s, v = f.vals[s];
      b.textContent = v == null ? '' : q.chips[v];
      b.classList.toggle('active', s === f.active && v == null);
    });
    chips.forEach(b => {
      const j = +b.dataset.c;
      b.classList.toggle('used', f.used[j]);
      b.disabled = f.used[j] || quiz.done;
    });
    document.getElementById('check').disabled = f.vals.some(v => v == null);
  };
  chips.forEach(b => b.onclick = () => {
    if (quiz.done) return;
    const f = quiz.fill, j = +b.dataset.c;
    if (f.used[j]) return;
    let s = f.vals[f.active] == null ? f.active : f.vals.findIndex(v => v == null);
    if (s < 0) return;
    f.vals[s] = j; f.used[j] = true;
    const nxt = f.vals.findIndex(v => v == null);
    f.active = nxt < 0 ? s : nxt;
    sync();
  });
  slots.forEach(b => b.onclick = () => {
    if (quiz.done) return;
    const f = quiz.fill, s = +b.dataset.s;
    if (f.vals[s] != null) { f.used[f.vals[s]] = false; f.vals[s] = null; }
    f.active = s; sync();
  });
  document.getElementById('check').onclick = checkFill;
  sync();
}
function checkFill() {
  if (quiz.done) return;
  quiz.done = true;
  const q = quiz.qs[quiz.i], f = quiz.fill;
  let wrong = 0;
  app.querySelectorAll('.slot').forEach(b => {
    const s = +b.dataset.s, good = norm(q.chips[f.vals[s]]) === norm(q.slots[s].ans);
    b.classList.remove('active'); b.classList.add(good ? 'right' : 'wrong'); b.disabled = true;
    if (!good) wrong++;
  });
  app.querySelectorAll('.chip').forEach(b => { b.disabled = true; });
  document.getElementById('check').classList.add('hidden');
  if (wrong) document.getElementById('ans').textContent = 'جواب‌های درست: ' + q.answers.join('، ');
  settle(q, wrong ? 'lose' : 'win', save.gain * 2, document.getElementById('qcard'));
}

function settle(q, kind, gain, anchor) {
  const banana = q.type === 'poem';
  let delta = 0, bonus = false;
  if (kind === 'win') {
    quiz.streak++; quiz.correct++;
    if (banana) delta = 1;
    else { delta = gain; if (quiz.streak % 3 === 0) { delta += Math.ceil(save.gain / 2); bonus = true; } }
  } else if (kind === 'lose') {
    quiz.streak = 0; quiz.wrong.push(q); delta = banana ? -1 : -save.loss;
  } else {
    quiz.streak = 0; quiz.wrong.push(q);
  }
  let real;
  if (banana) {
    const before = save.bananas;
    save.bananas = Math.max(0, save.bananas + delta);
    real = save.bananas - before; quiz.bnet += real;
  } else {
    const before = save.coins;
    save.coins = Math.max(0, save.coins + delta);
    real = save.coins - before; quiz.net += real;
  }
  persist();
  showDelta(real, banana ? 'ban' : 'coin');
  const qc = document.getElementById('qcard');
  if (kind === 'win') {
    sndRight();
    if (banana) burst(anchor, 8, s => petSVG(PET_KEYS[Math.floor(Math.random() * PET_KEYS.length)], s), 26); else burst(anchor, bonus ? 18 : 10);
    const praise = shuffle(['آفرین!', 'عالی بود!', 'درست گفتی!', 'تو یه ستاره‌ای!'])[0];
    setCoach('happy', praise + (banana ? ' یک دوست مکعبی گرفتی!' : '') + (bonus ? ' سه جواب درست پشت‌سرهم! سکهٔ جایزه گرفتی.' : '') + (q.note ? ' ' + esc(q.note) + '.' : ''));
  } else if (kind === 'lose') {
    sndWrong(); qc.classList.add('shake');
    const msg = banana ? 'نشد! کارتِ سبز، معنی درست بود.'
      : q.kind === 'fill' ? 'نشد! جواب‌های درست بالای این پیام نوشته شده.'
      : `نشد! جواب درست: ${q.answers.map(esc).join('، ')}${q.note ? ' (' + esc(q.note) + ')' : ''}`;
    setCoach('sad', msg);
  } else {
    sndWrong();
    setCoach('sad', 'نزدیک بود! یکی دو تا جا افتاد.');
  }
  const next = document.getElementById('next');
  next.textContent = quiz.i === quiz.qs.length - 1 ? 'دیدن نتیجه' : 'سؤال بعدی';
  next.classList.remove('hidden');
  next.onclick = () => { quiz.i++; quiz.i >= quiz.qs.length ? renderResult() : renderQuiz(); };
  next.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}
function reviewItem(q) {
  if (q.type === 'poem') return `<li><b>${esc(q.hems[0])}${q.prose ? '' : ' …'}</b> (${q.prose ? 'معنی متن' : 'معنی شعر'}): ${esc(q.answers[0])}</li>`;
  if (q.type === 'proverb') return `<li><b>${esc(q.w)}</b> (ضرب‌المثل): ${q.answers.map(esc).join('، ')}</li>`;
  if (q.type === 'fill') return `<li><b>${esc(q.w)}</b> (حفظ شعر): ${q.answers.map(esc).join('، ')}</li>`;
  if (q.type === 'device') return `<li><b>${esc(q.w)}</b> (آرایه ادبی): ${esc(q.answers[0])}</li>`;
  if (q.type === 'grammar') return `<li><b>${esc(q.w)}</b> (نکته دستوری): ${esc(q.answers[0])}</li>`;
  return `<li><b>${q.w}</b> (${TYPES[q.type].label}): ${q.answers.map(esc).join('، ')}</li>`;
}
function renderResult() {
  const n = quiz.qs.length, s = quiz.correct, mode = quiz.mode;
  const ratio = s / n;
  const stars = ratio >= 0.9 ? 3 : ratio >= 0.6 ? 2 : 1;
  const msg = ['تمرین کنیم تا بهتر شوی!', 'خیلی خوب بود!', 'فوق‌العاده! ستارهٔ کلمه‌ها شدی!'][stars - 1];
  const up = mode !== 'poem' && rankIdx(save.coins) > quiz.rank0;
  const bigPrize = mode === 'poem' && s === n && n >= 3;
  if (bigPrize && !quiz.prizeGiven) { quiz.prizeGiven = true; save.peeled++; persist(); }
  const earn = mode === 'poem'
    ? `<div class="earn">${bananaSVG(36)}<span>${quiz.bnet >= 0 ? '+' : '−'}${fa(Math.abs(quiz.bnet))} دوست مکعبی</span></div>
       <p class="big">جمع دوست‌های مکعبی: ${fa(save.bananas)}</p>`
    : `<div class="earn">${coinSVG(30)}<span>${quiz.net >= 0 ? '+' : '−'}${fa(Math.abs(quiz.net))} سکه</span></div>
       <p class="big">جمع سکه‌ها: ${fa(save.coins)}</p>`;
  const wrongHtml = quiz.wrong.length ? `
    <div class="review">
      <h3>این‌ها را دوباره مرور کن</h3>
      <ul>${quiz.wrong.map(reviewItem).join('')}</ul>
    </div>` : '';
  app.innerHTML = `
    <section class="result">
      ${bigPrize ? `<div class="bigprize"><div class="dance">${peeledSVG(110)}</div><div class="up-msg">جایزهٔ بزرگ! یک اژدهای کوچولو گرفتی!</div></div>` : owl(stars >= 2 ? 'happy' : 'idle')}
      <div class="stars" aria-label="${fa(stars)} ستاره از ۳">${'★'.repeat(stars)}${'☆'.repeat(3 - stars)}</div>
      <h2>${msg}</h2>
      <p class="big">${fa(s)} پاسخ درست از ${fa(n)}</p>
      ${earn}
      ${up ? `<div class="up-msg">مقامت بالا رفت: ${RANKS[rankIdx(save.coins)][1]}</div>` : ''}
      ${mode === 'poem' ? '' : prizeBlock()}
      ${wrongHtml}
      <button class="primary" id="again">بازی دوباره</button>
      <button class="secondary" id="study">مرور فلش‌کارت‌ها</button>
      <button class="ghost" id="home">خانه</button>
    </section>`;
  if (stars >= 2 || up || bigPrize) sndWin();
  document.getElementById('again').onclick = () => startQuiz(mode);
  document.getElementById('study').onclick = () => renderPicker('study');
  document.getElementById('home').onclick = renderHome;
  bindPrize();
}

/* ------------------------- مرور فلش‌کارت‌ها ------------------------- */
let study = null;
function buildCards(ids) {
  const map = new Map();
  const get = (w, i) => {
    const k = norm(w);
    if (!map.has(k)) map.set(k, { w, meaning: [], antonym: [], family: [], lessons: new Set() });
    const c = map.get(k); c.lessons.add(i); return c;
  };
  const add = (arr, v) => { if (!arr.some(x => norm(x) === norm(v))) arr.push(v); };
  ids.forEach(i => {
    const L = LESSONS[i];
    L.meaning.forEach(e => add(get(e.w, i).meaning, e.a));
    L.antonym.forEach(e => add(get(e.w, i).antonym, e.a));
    L.family.forEach(e => e.members.forEach(m => add(get(e.w, i).family, m)));
    L.device.forEach(e => {
      const k = 'D:' + norm(e.h.join(''));
      if (!map.has(k)) map.set(k, { w: e.h.join(' / '), meaning: [], antonym: [], family: [], extra: [], lessons: new Set() });
      const c = map.get(k); c.lessons.add(i);
      c.extra.push({ label:'آرایه ادبی', color:'#8A3FC7', vals:[e.name + (e.note ? ' — ' + e.note : '')] });
    });
    L.grammar.forEach(e => {
      const k = 'G:' + norm(e.q);
      if (!map.has(k)) map.set(k, { w: e.q, meaning: [], antonym: [], family: [], extra: [], lessons: new Set() });
      const c = map.get(k); c.lessons.add(i);
      c.extra.push({ label:'پاسخ', color:'#2F6F3E', vals:[e.a] });
    });
    L.proverb.forEach(e => {
      const k = 'P:' + norm(e.p);
      if (!map.has(k)) map.set(k, { w: e.p, meaning: [], antonym: [], family: [], extra: [], lessons: new Set() });
      const c = map.get(k); c.lessons.add(i);
      c.extra.push({ label:'مفهوم', color:'#B5651D', vals:[e.m] });
    });
  });
  return [...map.values()];
}
function startStudy() {
  const ids = [...selected].sort((a, b) => a - b);
  study = { list: buildCards(ids), i: 0 };
  renderStudy();
}
function renderStudy() {
  const x = study.list[study.i], n = study.list.length, last = study.i === n - 1;
  const mk = (label, color, vals) => vals.length
    ? `<div class="row" style="--c:${color}"><span class="k">${label}</span><span class="v">${vals.map(v => `<div>${esc(v)}</div>`).join('')}</span></div>` : '';
  const lessons = [...x.lessons].map(i => LESSONS[i].name).join('، ');
  app.innerHTML = `
    ${hud(study.i + 1, n, false)}
    <div class="counter">${fa(study.i + 1)} از ${fa(n)}</div>
    <div class="scene">
      <div class="flip" id="flip" role="button" tabindex="0" aria-label="برگرداندن کارت">
        <div class="face front">
          <div class="word ${wsize(x.w)}">${x.w}</div>
          <p class="hint">برای دیدن پاسخ، کارت را لمس کن</p>
          <p class="lsn">${lessons}</p>
        </div>
        <div class="face back">
          ${mk('معنی', 'var(--meaning)', x.meaning)}
          ${mk('مخالف', 'var(--antonym)', x.antonym)}
          ${mk('هم‌خانواده', 'var(--family)', x.family)}
          ${(x.extra || []).map(r => mk(r.label, r.color, r.vals)).join('')}
        </div>
      </div>
    </div>
    <div class="nav">
      <button class="secondary" id="prev" ${study.i === 0 ? 'disabled' : ''}>قبلی</button>
      <button class="primary" id="nxt">${last ? 'شروع بازی' : 'بعدی'}</button>
    </div>`;
  const flip = document.getElementById('flip');
  const toggle = () => flip.classList.toggle('is-flipped');
  flip.onclick = toggle;
  flip.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); } };
  document.getElementById('home').onclick = renderHome;
  document.getElementById('prev').onclick = () => { study.i--; renderStudy(); };
  document.getElementById('nxt').onclick = () => { if (last) startQuiz('words'); else { study.i++; renderStudy(); } };
}

/* ------------------------- تنظیمات والدین ------------------------- */
function renderSettings() {
  app.innerHTML = `
    <div class="top"><button class="ghost" id="home">خانه</button><h2 class="ttl">تنظیمات والدین</h2></div>
    <label class="fld">نام جایزهٔ بزرگ
      <input id="pn" type="text" maxlength="40" value="${esc(save.prizeName)}" placeholder="مثلا: بستنی یا سینما">
    </label>
    <label class="fld">برای گرفتن جایزه چند سکه لازم باشد؟
      <input id="pg" inputmode="numeric" value="${save.prizeGoal}">
    </label>
    <label class="fld">سکهٔ هر جواب درست
      <input id="g" inputmode="numeric" value="${save.gain}">
    </label>
    <label class="fld">سکه‌ای که با هر جواب غلط کم می‌شود
      <input id="l" inputmode="numeric" value="${save.loss}">
    </label>
    <div class="stack">
      <button class="secondary" id="snd">${save.sound ? 'صدا: روشن' : 'صدا: خاموش'}</button>
      <button class="primary" id="saveS">ذخیره</button>
      <button class="ghost" id="reset">صفر کردن سکه‌ها و دوست‌ها</button>
    </div>`;
  document.getElementById('home').onclick = renderHome;
  document.getElementById('snd').onclick = e => { save.sound = !save.sound; e.target.textContent = save.sound ? 'صدا: روشن' : 'صدا: خاموش'; };
  document.getElementById('saveS').onclick = () => {
    const num = (id, d, min) => { const v = toNum(document.getElementById(id).value); return Number.isFinite(v) && v >= min ? v : d; };
    save.prizeName = document.getElementById('pn').value.trim();
    save.prizeGoal = num('pg', save.prizeGoal, 10);
    save.gain = num('g', save.gain, 1);
    save.loss = num('l', save.loss, 0);
    persist(); renderHome();
  };
  let armed = false;
  const rs = document.getElementById('reset');
  rs.onclick = () => {
    if (!armed) { armed = true; rs.textContent = 'مطمئنید؟ دوباره بزنید'; return; }
    save.coins = 0; save.bananas = 0; save.peeled = 0; persist(); renderHome();
  };
}

  renderHome();
